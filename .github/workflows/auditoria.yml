name: Auditoria forense InsecurePay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilacion y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn clean test
        working-directory: backend
        run: mvn -B clean test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilacion Angular
        working-directory: frontend
        run: |
          npm ci
          npx ng build

  evidencias:
    name: Evidencias periciales (${{ matrix.version }})
    needs: pruebas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: antes
            ref: version-vulnerable
          - version: despues
            ref: main
    env:
      VERSION_AUDITADA: ${{ matrix.version }}
      SALIDA: ${{ github.workspace }}/evidencias
    steps:
      - uses: actions/checkout@v4
        with:
          path: actual

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Iniciar backend
        working-directory: app/backend
        run: |
          mvn -B -q package -DskipTests
          export INSECUREPAY_JWT_SECRET="$(openssl rand -base64 48)"
          JAR="$(ls target/*.jar | grep -v '\.original$' | head -n 1)"
          nohup java -jar "$JAR" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/api && break
            sleep 2
          done

      - name: Iniciar frontend
        working-directory: app/frontend
        run: |
          npm ci
          npx ng build
          DIST="$(ls -d dist/*/browser | head -n 1)"
          nohup npx --yes serve@14 -s "$DIST" -l 4200 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4200 && break
            sleep 2
          done

      - name: Pruebas de concepto HTTP
        run: |
          mkdir -p "$SALIDA"
          bash actual/scripts/poc.sh | tee "$SALIDA/poc-${{ matrix.version }}.txt"

      - name: Prueba de concepto XSS en navegador
        working-directory: actual/scripts
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node xss-playwright.mjs | tee "$SALIDA/xss-${{ matrix.version }}.txt"

      - name: Registro del backend
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/backend.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-${{ matrix.version }}
          path: evidencias

  publicar:
    name: Publicar evidencias en rama evidencias-ci
    needs: evidencias
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: evidencias
          merge-multiple: true

      - name: Publicar
        working-directory: evidencias
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b evidencias-ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Evidencias periciales generadas desde ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" evidencias-ci
